query CheckoutCollectionPoints($id: ID!) {
	checkout(id: $id) {
		id
		availableCollectionPoints {
			id
			name
			slug
			address {
				streetAddress1
				city
				postalCode
				countryArea
				country {
					country
					code
				}
			}
		}
		deliveryMethod {
			__typename
			... on Warehouse {
				id
				name
			}
		}
	}
}
